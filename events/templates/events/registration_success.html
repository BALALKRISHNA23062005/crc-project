{% extends 'base.html' %}
{% block content %}
<h2>You're Registered!</h2>
<p>{{ registration.member.name }}, you're registered for <strong>{{ registration.event.title }}</strong>.</p>
<p>Show this QR code at check-in:</p>
<img src="/events/qr/{{ registration.id }}/" alt="Your QR Code" class="mb-3">
<br>
<a href="/events/pay/{{ registration.id }}/" class="btn btn-warning">Pay Registration Fee</a>
<a href="/events/" class="btn btn-outline-secondary">Back to Events</a>
{% endblock %}
