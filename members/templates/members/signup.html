{% extends 'base.html' %}
{% block content %}
<h2>Sign Up for CRC</h2>
{% if error %}
  <div class="alert alert-danger">{{ error }}</div>
{% endif %}
<form method="post" class="col-md-6">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">Sign Up</button>
</form>
{% endblock %}
